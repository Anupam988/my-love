<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promita's Valentine Week 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffeff2, #fff0f5);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            color: #5d2d47;
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            text-align: center;
        }
        
        header {
            margin-bottom: 40px;
        }
        
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #e6396f;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #a64d79;
            margin-bottom: 20px;
        }
        
        .date-display {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 12px 25px;
            border-radius: 25px;
            display: inline-block;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(230, 57, 111, 0.15);
            margin-bottom: 15px;
            color: #e6396f;
        }
        
        .instructions {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 800px;
            margin: 0 auto 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            font-size: 1.05rem;
            line-height: 1.5;
        }
        
        .instructions i {
            color: #e6396f;
            margin: 0 5px;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 40px;
        }
        
        .day-card {
            background: linear-gradient(135deg, #ffffff, #fff5f8);
            border-radius: 15px;
            padding: 20px 15px;
            box-shadow: 0 8px 20px rgba(166, 77, 121, 0.15);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid transparent;
            min-height: 180px;
        }
        
        .day-card:hover:not(.locked) {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(230, 57, 111, 0.25);
            border-color: rgba(230, 57, 111, 0.3);
        }
        
        .day-card.today {
            background: linear-gradient(135deg, #ffe6ee, #ffd6e4);
            border: 2px solid #e6396f;
            animation: floatCard 3s ease-in-out infinite;
        }
        
        .day-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(40%);
        }
        
        .day-card.locked:hover {
            transform: none;
            box-shadow: 0 8px 20px rgba(166, 77, 121, 0.15);
            border-color: transparent;
        }
        
        .lock-icon {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #a64d79;
            font-size: 1.2rem;
        }
        
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .day-number {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #e6396f;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 8px rgba(230, 57, 111, 0.3);
        }
        
        .day-card.locked .day-number {
            background-color: #a64d79;
            opacity: 0.8;
        }
        
        .day-card-icon {
            font-size: 3.5rem;
            margin: 15px 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .day-card.locked .day-card-icon {
            opacity: 0.7;
        }
        
        .day-theme {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #e6396f;
            margin-bottom: 5px;
            text-align: center;
            line-height: 1.2;
        }
        
        .day-card.locked .day-theme {
            color: #a64d79;
        }
        
        .date {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: #a64d79;
            font-weight: 600;
        }
        
        .day-card.locked .date {
            color: #8a7f84;
        }
        
        /* Popup Card Styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            backdrop-filter: blur(5px);
            padding: 20px;
        }
        
        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .popup-card {
            width: 100%;
            max-width: 900px;
            height: auto;
            max-height: 90vh;
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #ffffff, #ffeef2);
            display: flex;
            flex-direction: column;
        }
        
        .popup-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        
        .popup-header {
            text-align: center;
            padding: 30px 40px 20px;
            flex-shrink: 0;
            background: linear-gradient(135deg, rgba(255, 238, 242, 0.9), rgba(255, 226, 238, 0.9));
            border-bottom: 2px solid rgba(230, 57, 111, 0.2);
        }
        
        .popup-icon {
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .popup-theme {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #e6396f;
            margin-bottom: 5px;
        }
        
        .popup-date {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #a64d79;
            font-weight: 600;
        }
        
        .popup-body {
            display: flex;
            flex: 1;
            gap: 30px;
            padding: 30px 40px;
            overflow: hidden;
            min-height: 0;
        }
        
        .popup-image-container {
            flex: 1;
            min-width: 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .popup-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .popup-image:hover {
            transform: scale(1.05);
        }
        
        .popup-message-container {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .popup-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #e6396f;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .popup-message {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #5d2d47;
            margin-bottom: 20px;
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px 0;
            max-height: 300px;
        }
        
        .popup-message::-webkit-scrollbar {
            width: 6px;
        }
        
        .popup-message::-webkit-scrollbar-track {
            background: rgba(230, 57, 111, 0.1);
            border-radius: 10px;
        }
        
        .popup-message::-webkit-scrollbar-thumb {
            background: rgba(230, 57, 111, 0.3);
            border-radius: 10px;
        }
        
        .popup-message::-webkit-scrollbar-thumb:hover {
            background: rgba(230, 57, 111, 0.5);
        }
        
        .popup-wish {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #e6396f;
            font-style: italic;
            text-align: center;
            padding: 15px;
            background: rgba(255, 226, 238, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(230, 57, 111, 0.2);
            margin-top: 10px;
            flex-shrink: 0;
        }
        
        .close-popup {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #e6396f;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .close-popup:hover {
            background-color: #d32f62;
            transform: scale(1.1);
        }
        
        /* Emoji Burst Animation */
        .emoji-burst {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 2rem;
            opacity: 0;
            animation: burst 3s forwards;
        }
        
        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(360deg);
            }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background-color: #e6396f;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 15px rgba(230, 57, 111, 0.3);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }
        
        .btn:hover {
            background-color: #d32f62;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(230, 57, 111, 0.4);
        }
        
        .btn:disabled {
            background-color: #a64d79;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
            box-shadow: 0 6px 15px rgba(166, 77, 121, 0.3);
        }
        
        .footer {
            margin-top: 40px;
            color: #a64d79;
            padding: 20px;
            text-align: center;
            font-style: italic;
            width: 100%;
            max-width: 800px;
        }
        
        /* Developer mode indicator - hidden by default */
        .dev-mode-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            z-index: 9999;
            opacity: 0.7;
            font-family: monospace;
        }
        
        /* Responsive design */
        @media (max-width: 1100px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 900px) {
            .popup-body {
                flex-direction: column;
                gap: 25px;
                padding: 25px 30px;
            }
            
            .popup-image-container {
                height: 250px;
                flex: none;
            }
            
            .popup-message-container {
                min-height: 300px;
            }
            
            .popup-message {
                max-height: 200px;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }
            
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .day-card {
                min-height: 160px;
                padding: 15px 10px;
            }
            
            .day-theme {
                font-size: 1.6rem;
            }
            
            .popup-header {
                padding: 25px 30px 15px;
            }
            
            .popup-theme {
                font-size: 2.3rem;
            }
            
            .popup-date {
                font-size: 1.2rem;
            }
            
            .popup-body {
                padding: 20px 25px;
            }
            
            .popup-title {
                font-size: 1.9rem;
            }
            
            .popup-message {
                font-size: 1.1rem;
                max-height: 180px;
            }
            
            .popup-wish {
                font-size: 1.6rem;
                padding: 12px;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 576px) {
            body {
                padding: 20px 15px;
            }
            
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            
            .day-card {
                min-height: 150px;
            }
            
            .day-theme {
                font-size: 1.5rem;
            }
            
            .day-card-icon {
                font-size: 3rem;
                height: 60px;
            }
            
            .popup-overlay {
                padding: 15px;
            }
            
            .popup-header {
                padding: 20px 25px 10px;
            }
            
            .popup-theme {
                font-size: 2rem;
            }
            
            .popup-date {
                font-size: 1.1rem;
            }
            
            .popup-body {
                padding: 15px 20px;
                gap: 20px;
            }
            
            .popup-image-container {
                height: 200px;
            }
            
            .popup-title {
                font-size: 1.7rem;
                margin-bottom: 15px;
            }
            
            .popup-message {
                font-size: 1rem;
                max-height: 150px;
            }
            
            .popup-wish {
                font-size: 1.4rem;
                padding: 10px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
        
        @media (max-width: 400px) {
            .cards-grid {
                grid-template-columns: repeat(1, 1fr);
                max-width: 300px;
            }
            
            .popup-theme {
                font-size: 1.8rem;
            }
            
            .popup-image-container {
                height: 180px;
            }
        }
        
        /* Very small height screens */
        @media (max-height: 700px) {
            .popup-card {
                max-height: 85vh;
            }
            
            .popup-header {
                padding: 20px 30px 15px;
            }
            
            .popup-body {
                padding: 20px 30px;
            }
            
            .popup-image-container {
                height: 200px;
            }
            
            .popup-message {
                max-height: 150px;
            }
        }
        
        @media (max-height: 600px) {
            .popup-card {
                max-height: 80vh;
            }
            
            .popup-header {
                padding: 15px 25px 10px;
            }
            
            .popup-theme {
                font-size: 2rem;
            }
            
            .popup-body {
                padding: 15px 25px;
                gap: 15px;
            }
            
            .popup-image-container {
                height: 180px;
            }
            
            .popup-message {
                max-height: 120px;
            }
        }
        #topimg{
            width: 200px;
            border-radius: 20px;          /* radius */
            transition: all 0.35s ease;   /* smooth animation */
            cursor: pointer;
            }

            /* hover animation */
            #topimg:hover{
            transform: scale(1.08) translateY(-6px); /* zoom + lift */
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
            }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <img id="topimg" src="./asset/top.jpeg" width="200px" alt="">
            <h1>Promita's Valentine Week</h1>
            <p class="subtitle">Click on any day to open a special card with beautiful image and message</p>
            <div class="date-display">
                <i class="fas fa-calendar-alt"></i> 
                Today is: <span id="today-date">Loading...</span>
            </div>
        </header>
    
        
        <div class="cards-grid" id="cards-grid">
            <!-- Day cards will be generated by JavaScript -->
        </div>
        
        <div class="controls">
            <button class="btn" id="open-today-btn">
                <i class="fas fa-calendar-day"></i> Open Today's Card
            </button>
        </div>
        <center>
        <div class="footer">
            <p>Made with <i class="fas fa-heart" style="color: #e6396f;"></i> for My Motku Malai - Each day holds a special message from my heart</p>
            <p>Valentine's Week 2026: February 7th to February 14th</p>
        </div>
        </center>
    </div>
    
    <!-- Popup Overlay -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-card">
            <button class="close-popup" id="close-popup">
                <i class="fas fa-times"></i>
            </button>
            <div class="popup-content" id="popup-content">
                <!-- Popup content will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DEVELOPER VARIABLE - CHANGE THIS TO UNLOCK ALL DAYS
        // Set to true to unlock all days, false for normal date-based locking
        // ============================================
        const unlockAllDays = false; // Change this to true to unlock all days
        // ============================================
        
        // Show developer mode indicator if all days are unlocked
        if (unlockAllDays) {
            const devIndicator = document.createElement('div');
            devIndicator.className = 'dev-mode-indicator';
            devIndicator.textContent = 'DEV MODE: All Days Unlocked';
            document.body.appendChild(devIndicator);
        }
        
        // Current day index (for auto-opening today's card)
        let todayIndex = -1;
        let todayIsUnlocked = false;
        
        // Valentine's Week data for Feb 7-14, 2026 with image URLs
        const valentineWeekData = [

            },
            {
                date: "2026-02-08",

                wish: "On Propose Day, I promise my forever to you!",
                color: "#ff6b9d",
                emojis: ["💍", "💎", "💖", "❤️", "💕", "💓", "💗", "💘"],

            },
            {
                date: "2026-02-09",
                dayNumber: 3,

                wish: "Happy Chocolate Day, my sweetheart!",
                color: "#8b4513",
                emojis: ["🍫", "🍬", "🍭", "🎂", "🍰", "🧁", "🍩", "🍪"],
                image: "https://images.unsplash.com/photo-1511381939415-e44015466834?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                date: "2026-02-10",
                dayNumber: 4,
                theme: "Teddy Day",
                title: "My Cuddly Companion",
                icon: "🧸",
                message: "Just as a teddy bear is soft and comforting, I want to be your safe place forever. You can always count on my warm hugs and unconditional love. Like a teddy bear that's always there to comfort, I want to be your constant companion through life's ups and downs. You can snuggle into my love whenever you need comfort, and I'll always be there to wipe away your tears and share your joys. You are my favorite cuddle buddy, my soft place to land, my forever teddy bear.",
                wish: "Happy Teddy Day, my cuddly love!",

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('today-date').textContent = today.toLocaleDateString('en-US', options);
        
        // Format date for display
        function formatDateDisplay(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }
        
        // Format short date
        function formatShortDate(dateString) {
            const date = new Date(dateString);
            const month = date.toLocaleDateString('en-US', { month: 'short' });
            return `${month} ${date.getDate()}`;
        }
        
        // Check if a date is today or in the past
        function isDateUnlocked(dateString) {
            // If developer mode is on, all dates are unlocked
            if (unlockAllDays) {
                return true;
            }
            
            const cardDate = new Date(dateString);
            const today = new Date();
            
            // Set both dates to midnight for accurate comparison
            cardDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            
            return cardDate <= today;
        }
        
        // Render all day cards
        function renderDayCards() {
            const container = document.getElementById('cards-grid');
            container.innerHTML = '';
            
            valentineWeekData.forEach((dayData, index) => {
                const isToday = dayData.date === todayString;
                const isUnlocked = isDateUnlocked(dayData.date);
                
                // Store today's index for auto-opening
                if (isToday) {
                    todayIndex = index;
                    todayIsUnlocked = isUnlocked;
                }
                
                // Create day card
                const dayCard = document.createElement('div');
                dayCard.className = `day-card ${isToday ? 'today' : ''} ${!isUnlocked ? 'locked' : ''}`;
                dayCard.dataset.index = index;
                dayCard.dataset.unlocked = isUnlocked;
                
                // Add lock icon for locked days (only if not in developer mode)
                if (!isUnlocked && !unlockAllDays) {
                    const lockIcon = document.createElement('div');
                    lockIcon.className = 'lock-icon';
                    lockIcon.innerHTML = '<i class="fas fa-lock"></i>';
                    dayCard.appendChild(lockIcon);
                }
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = dayData.dayNumber;
                
                const cardIcon = document.createElement('div');
                cardIcon.className = 'day-card-icon';
                cardIcon.innerHTML = dayData.icon;
                cardIcon.style.color = dayData.color;
                
                const dayTheme = document.createElement('h3');
                dayTheme.className = 'day-theme';
                dayTheme.textContent = dayData.theme;
                dayTheme.style.color = dayData.color;
                
                const date = document.createElement('div');
                date.className = 'date';
                date.textContent = formatShortDate(dayData.date);
                
                dayCard.appendChild(dayNumber);
                dayCard.appendChild(cardIcon);
                dayCard.appendChild(dayTheme);
                dayCard.appendChild(date);
                
                // Add click event to open popup only if unlocked
                if (isUnlocked) {

            header.className = 'popup-header';
            
            const popupIcon = document.createElement('div');
            popupIcon.className = 'popup-icon';
            popupIcon.innerHTML = dayData.icon;
            popupIcon.style.color = dayData.color;
            
            const popupTheme = document.createElement('h2');
            popupTheme.className = 'popup-theme';
            popupTheme.textContent = dayData.theme;
            popupTheme.style.color = dayData.color;
            
            const popupDate = document.createElement('div');
            popupDate.className = 'popup-date';
            popupDate.textContent = formatDateDisplay(dayData.date);
            
            header.appendChild(popupIcon);
            header.appendChild(popupTheme);
            header.appendChild(popupDate);
            
            // Body section with image and message
            const body = document.createElement('div');
            body.className = 'popup-body';
            
            // Image container
            const imageContainer = document.createElement('div');
            imageContainer.className = 'popup-image-container';
            
            const image = document.createElement('img');
            image.className = 'popup-image';
            image.src = dayData.image;
            image.alt = dayData.theme;
            image.loading = 'lazy';
            
            imageContainer.appendChild(image);
            
            // Message container
            const messageContainer = document.createElement('div');
            messageContainer.className = 'popup-message-container';
            
            const popupTitle = document.createElement('h3');
            popupTitle.className = 'popup-title';
            popupTitle.textContent = dayData.title;
            popupTitle.style.color = dayData.color;
            
            const popupMessage = document.createElement('div');
            popupMessage.className = 'popup-message';
            popupMessage.textContent = dayData.message;
            
            const popupWish = document.createElement('div');
            popupWish.className = 'popup-wish';
            popupWish.textContent = dayData.wish;
            popupWish.style.color = dayData.color;
            
            messageContainer.appendChild(popupTitle);
            messageContainer.appendChild(popupMessage);
            messageContainer.appendChild(popupWish);
            
            // Add image and message containers to body
            body.appendChild(imageContainer);
            body.appendChild(messageContainer);
            
            // Add header and body to popup content
            popupContent.appendChild(header);
            popupContent.appendChild(body);
            
            // Show popup
            overlay.classList.add('active');
            
            // Trigger emoji burst
            triggerEmojiBurst(dayData.emojis);
        }
        
        // Trigger emoji burst animation
        function triggerEmojiBurst(emojis) {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            // Create 30 emojis for the burst effect
            for (let i = 0; i < 30; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'emoji-burst';
                
                // Randomly select an emoji from the day's emoji array
                const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.textContent = randomEmoji;
                
                // Random starting position (center of screen)
                const startX = screenWidth / 2;
                const startY = screenHeight / 2;
                
                // Random end position (anywhere on screen)
                const endX = (Math.random() - 0.5) * screenWidth * 1.5;
                const endY = (Math.random() - 0.5) * screenHeight * 1.5;
                
                // Set custom CSS properties for animation
                emoji.style.left = `${startX}px`;
                emoji.style.top = `${startY}px`;
                emoji.style.setProperty('--tx', `${endX}px`);
                emoji.style.setProperty('--ty', `${endY}px`);
                
                // Random size
                const size = 1 + Math.random() * 1.5;
                emoji.style.fontSize = `${size}rem`;
                
                // Random color variation
                const hue = Math.floor(Math.random() * 360);
                emoji.style.filter = `hue-rotate(${hue}deg)`;
                
                // Add to document
                document.body.appendChild(emoji);
                
                // Remove after animation completes
                setTimeout(() => {
                    emoji.remove();
                }, 3000);
            }
        }
        
        // Close popup
        document.getElementById('close-popup').addEventListener('click', function() {
            const overlay = document.getElementById('popup-overlay');
            overlay.classList.remove('active');
        });
        
        // Open today's card button
        document.getElementById('open-today-btn').addEventListener('click', function() {
            if (todayIndex >= 0 && todayIsUnlocked) {
                openPopup(todayIndex);
            }
        });
        
        // Auto-open today's card on page load (after a delay) only if today is unlocked
        setTimeout(() => {
            if (todayIndex >= 0 && todayIsUnlocked) {
                openPopup(todayIndex);
            }
        }, 1500);
        
        // Close popup when clicking outside the card
        document.getElementById('popup-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });
        
        // Initialize day cards
        renderDayCards();
        
        // Add entrance animation to day cards
        setTimeout(() => {
            const dayCards = document.querySelectorAll('.day-card');
            dayCards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        }, 300);
    </script>
</body>
</html>
